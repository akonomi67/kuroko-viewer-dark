"x": "【ハンターハンター】ユピーとプフ、\n王への向き合い方が真逆だった護衛軍の\n二体に対する読者の反応集を紹介するよ！"}, {"t": 7.5, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 12.416666666666666, "x": "王直属護衛軍の話になると、\nだいたいピトーの話だけで終わってしまうだろ"}, {"t": 17.733333333333334, "x": "二体が置いていかれてる"}, {"t": 19.233333333333334, "x": "シャウアプフとモントゥトゥユピー、\nこの名前を正確に書ける読者はかなり少ないわ"}, {"t": 24.35, "x": "長いからな"}, {"t": 25.283333333333335, "x": "三体とも同じ王のために生まれてきたのに、\n語られる量にここまで差が出るのは変だぞ"}, {"t": 30.916666666666668, "x": "ピトーは登場の仕方が派手だったからな。\nカイトとの一件で全部を持っていった"}, {"t": 35.766666666666666, "x": "あれは反則だ"}, {"t": 36.8, "x": "残りの二体は王宮の中でずっと動いていた分、\n絵として地味になってしまったんだ"}, {"t": 42.083333333333336, "x": "地味というより、担当しているのが政治と\n防衛の側だからな。派手にはならないわ"}, {"t": 47.666666666666664, "x": "戦闘以外の担当だ"}, {"t": 49.3, "x": "ただ中身を並べ直すと、この二体は正反対に\n設計されていることがはっきりするぞ"}, {"t": 55.03333333333333, "x": "同じ王のためという出発点から\n歩き出したのに、行き着いた先が真逆なんだ"}, {"t": 60.46666666666667, "x": "そこが面白い"}, {"t": 61.583333333333336, "x": "片方は王を型にはめようとして、もう片方は\n王の変化をそのまま受け取っている"}, {"t": 66.9, "x": "素材からして違うわ。蝶と魔獣では、\n出来上がるものが同じになるはずがない"}, {"t": 71.8, "x": "プフは蝶の特性を持つ操作系で、ユピーは\n魔獣との摂食交配で生まれた個体だ"}, {"t": 77.48333333333333, "x": "混ざり方が違う"}, {"t": 78.75, "x": "護衛軍で魔獣が入っているのはユピーだけでな。\n三体の中でも生まれが特殊だぞ"}, {"t": 84.33333333333333, "x": "王を守る手段が、生まれた時点で頭の\n担当と腕の担当に分かれていたことになる"}, {"t": 90.05, "x": "役割分担だな"}, {"t": 91.41666666666667, "x": "護衛軍という呼び名も、\n実際にやっていた仕事の\n中身とは少しずれているぞ"}, {"t": 96.4, "x": "三体とも王の警護そのものより、王の\n周りをどう整えるかに時間を割いている"}, {"t": 101.56666666666666, "x": "その分担が終盤で完全に裏目に出ると\nいうのが、この章の一番きつい部分だ"}, {"t": 106.5, "x": "順番に見ていくか。まずはプフの中身からだな"}, {"t": 110.01666666666667, "x": "そこからでいい"}, {"t": 110.98333333333333, "x": "プフの能力は、名前の響きから\n受ける印象よりずっと厄介な作りをしているぞ"}, {"t": 116.21666666666667, "x": "鱗粉を相手に浴びせて、オーラの流れを\n読むことで相手の思考まで把握できる"}, {"t": 121.15, "x": "読心に近いやつだ"}, {"t": 122.68333333333334, "x": "しかも鱗粉を受けた側は洗脳された\n状態になって、そのまま操作対象にできる"}, {"t": 128.21666666666667, "x": "情報を集めるのと相手を支配するのが、\n同じ一手で片付いてしまうからな"}, {"t": 133.15, "x": "効率が良すぎる"}, {"t": 134.4, "x": "王宮の中で誰が何を考えているかを、\n常時見張れる立場だったということだ"}, {"t": 139.16666666666666, "x": "もう一つが分裂だな。あれも\n戦闘用ではなく捜索用の作りになっているぞ"}, {"t": 144.66666666666666, "x": "王宮に入り込んできた人間を探す仕事も、\nほとんどプフが引き受けていたわけだ"}, {"t": 149.96666666666667, "x": "自分の肉体を無数に割って、ナノレベルの\n極小の生物群に変えることができる"}, {"t": 155.45, "x": "ただし本体は蜂ぐらいの大きさを\n保たないといけないという縛りが付いている"}, {"t": 160.13333333333333, "x": "制限付きだ"}, {"t": 161.16666666666666, "x": "分身の側は非力になるから、頭数が\n増えても戦力としては数えられないわけだ"}, {"t": 166.73333333333332, "x": "探すための力であって、殴るための\n力ではないというのがはっきりしているな"}, {"t": 171.31666666666666, "x": "諜報担当だ"}, {"t": 172.43333333333334, "x": "だから護衛軍の中で一番、兵隊らしくない\n動き方をし続けていた個体になる"}, {"t": 177.8, "x": "忠誠の強さなら三体で一番だと書かれることが\n多いが、そこに落とし穴があるぞ"}, {"t": 183.3, "x": "向き先の話だな"}, {"t": 184.83333333333334, "x": "プフが忠誠を捧げている相手は\n王本人ではなく、自分が考える理想の王なんだ"}, {"t": 190.4, "x": "ここを取り違えると、王宮でのプフの\n行動が最後まで理解できなくなるからな"}, {"t": 195.55, "x": "前提が違う"}, {"t": 196.65, "x": "王はこうあるべきだ、\nこうであってはいけない、\nという信念が先に立っている"}, {"t": 201.41666666666666, "x": "その信念に合わない要素を見つけると、\n王に相談せずに裏で消しにいくわけだ"}, {"t": 206.1, "x": "完全な独断だ"}, {"t": 207.35, "x": "護衛のはずなのに、守るべき相手の\n意思を勝手に上書きしにいっているだろ"}, {"t": 212.11666666666667, "x": "上司が出した判断を、部下が黙って\n握り潰しているのと同じ構図だぞ"}, {"t": 216.93333333333334, "x": "中間管理職だな"}, {"t": 218.46666666666667, "x": "実際、王宮でプフが動いた回数は\n他の二体と比べて圧倒的に多いんだ"}, {"t": 223.8, "x": "しかもその大半が対人間ではなく、\n対王に向けて使われているのが異常だぞ"}, {"t": 229.01666666666668, "x": "外ではなく中の仕事だ"}, {"t": 230.86666666666667, "x": "敵と戦っている時間より、王の心を\nどう管理するかに時間を使っているわけだ"}, {"t": 236.26666666666668, "x": "護衛軍というより、教祖と信者を一人で\n兼ねているような立ち位置になっている"}, {"t": 240.7, "x": "自作自演だ"}, {"t": 241.68333333333334, "x": "理想を自分の頭の中で作って、その理想を\n守ろうとして勝手に苦しんでいる"}, {"t": 247.1, "x": "あの苦しみ方は蟻と\nいうより人間そのもので、\nそこが読者に刺さっているわ"}, {"t": 252.08333333333334, "x": "妙に生々しい"}, {"t": 253.3, "x": "一方のユピーは、考えるという工程が\nほとんど省かれている個体だな"}, {"t": 258.0, "x": "唯一魔獣と混ざって生まれた分、単純な\n出力の大きさが三体で頭一つ抜けている"}, {"t": 263.9, "x": "力が全部だ"}, {"t": 265.05, "x": "肉体を次々に変異させて、形を\n変えながら戦うのがユピーの戦い方になる"}, {"t": 270.75, "x": "翼を生やして飛ぶことも、腕を\n巨大化させて叩き潰すこともできるからな"}, {"t": 275.3333333333333, "x": "王宮での防衛戦で、正面に立って侵入者を const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
