7, "i": 682}, {"t": 723.0, "i": 683}, {"t": 724.5, "i": 684}, {"t": 726.0, "i": 685}, {"t": 727.4333333333333, "i": 686}], "subs": [{"t": 0.0, "x": "引用:ハンターハンター\n/富樫義博/週刊少年ジャンプ\n/集英社 /マッドハウス"}, {"t": 0.0, "x": "【ハンターハンター】カルトが旅団の\n4番に入ってまで取り戻したいものに\n対する読者の反応集を紹介するよ！"}, {"t": 6.816666666666666, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 11.733333333333333, "x": "幻影旅団の団員を全員挙げてくれと言われて、\n最後まで出てこないのがカルトだろ"}, {"t": 17.033333333333335, "x": "名前は知られているのに、何をした\n人物かまで出てくる読者は少ないだろ"}, {"t": 21.8, "x": "ゾルディック家の五人兄弟の末っ子で、\n旅団での団員番号は四番になる"}, {"t": 26.816666666666666, "x": "番号だけ見れば上位なのに、話題に\n出る回数は団員の中でも下の方だ"}, {"t": 31.4, "x": "番号が上なら出番も多いと\nいうわけではないのが、\nこの組織の面白さだな"}, {"t": 36.31666666666667, "x": "見た目が少女なので、男だと知らない\nまま読み進めた読者もいるはずだぞ"}, {"t": 41.3, "x": "家の側と旅団の側、その両方に\n籍を置いている珍しい立ち位置でもある"}, {"t": 46.21666666666667, "x": "家からも抜けていないし、旅団にも\n属しているという妙な状態にある"}, {"t": 50.666666666666664, "x": "旅団の話は山ほどされているのに、\nカルト単独の話はあまり見かけないだろ"}, {"t": 55.93333333333333, "x": "ゾルディック家の話でも、出てくるのは\nイルミとミルキとキルアばかりだ"}, {"t": 59.95, "x": "末っ子は後回しだな"}, {"t": 61.416666666666664, "x": "兄弟の並びで言えば、イルミ、ミルキ、\nキルア、アルカ、そしてカルトになる"}, {"t": 66.88333333333334, "x": "上の三人は出番が多いのに、\n下の二人だけ扱いが極端に薄いんだ"}, {"t": 71.7, "x": "ただし入団の経緯まで踏み込むと、\n兄弟の中で一番重い動機を持っているぞ"}, {"t": 77.01666666666667, "x": "今回はそこを掘る。まずは四番という席の話からだ"}, {"t": 81.03333333333333, "x": "ヒソカの席だな"}, {"t": 82.35, "x": "ヒソカは団長との一戦を終えた後、\n自分から旅団を離れる形になっただろ"}, {"t": 87.6, "x": "そこで一つ空いた"}, {"t": 88.86666666666666, "x": "四番はもともとヒソカが使っていた\n番号で、団長が一度預けていたものだ"}, {"t": 93.65, "x": "ヒソカが旅団を離れた後、その空いた席に\nカルトが入ったという流れになる"}, {"t": 98.75, "x": "入れ替わりだ"}, {"t": 99.63333333333334, "x": "旅団は欠員が出たら流星街から\n補充するのが基本の組織だっただろ"}, {"t": 104.23333333333333, "x": "そういう決まりだ"}, {"t": 105.35, "x": "流星街という共通の出身が、あの組織を\nまとめている接着剤でもあるからな"}, {"t": 110.83333333333333, "x": "ところがカルトは流星街の出身ではなく、\nゾルディック家の子どもだ"}, {"t": 115.33333333333333, "x": "出自の違う人間が四番に\n座っている時点で、\n普通の入り方ではないぞ"}, {"t": 120.38333333333334, "x": "組織の決まりを一つ曲げてまで\n入れているのが、まず引っかかる部分だ"}, {"t": 124.43333333333334, "x": "しかも入団の時点で、まだ年齢が\n一桁台に近い子どもだったことになる"}, {"t": 129.55, "x": "家を出て、盗賊団まで行って、\n番号をもらうまでを一人でやっている"}, {"t": 134.13333333333333, "x": "手順が異常だ"}, {"t": 135.25, "x": "あの家に生まれた子どもが、盗賊の\n集団へ自分から志願しているわけだ"}, {"t": 140.01666666666668, "x": "進路が独特すぎる"}, {"t": 141.51666666666668, "x": "能力の話も先に済ませておくか。\nカルトは操作系の能力者だ"}, {"t": 146.61666666666667, "x": "系統は操作系"}, {"t": 147.91666666666666, "x": "武器として使っているのが、紙で\n作った扇子と紙吹雪という組み合わせになる"}, {"t": 152.93333333333334, "x": "ゾルディック家の末っ子が、紙を\n武器にして戦うのは意外だっただろ"}, {"t": 157.0, "x": "針や電気を使う兄たちと比べると、\n選んだ道具がずいぶん静かだろ"}, {"t": 161.65, "x": "イルミは針、ミルキは工作、キルアは\n電気と爪という具合に分かれている"}, {"t": 166.46666666666667, "x": "兄弟で得物が一つも被っていないのが、\nこの家の面白いところだな"}, {"t": 171.16666666666666, "x": "教育方針なのか"}, {"t": 172.63333333333333, "x": "同じ家で育っているのに、戦い方が\n一人ずつ違うというのも珍しいぞ"}, {"t": 177.6, "x": "カルトはグリードアイランドにも\n入っていて、そこでも仕事をしているぞ"}, {"t": 181.81666666666666, "x": "あの島にもいた"}, {"t": 182.96666666666667, "x": "団員として単独で島へ入り、目的の\n人物を探し出すところまでやっている"}, {"t": 187.8, "x": "目的は除念師を探すことで、それを\n自分の力できちんと見つけ出している"}, {"t": 192.78333333333333, "x": "戦闘ではなく、探すという仕事の\n方で結果を出しているのが特徴だな"}, {"t": 197.56666666666666, "x": "荒事の担当ではなく、調べて\n見つける側で使われているのが分かる"}, {"t": 202.16666666666666, "x": "流星街に攻め込んできたキメラアントの\n討伐にも、旅団として参加している"}, {"t": 207.16666666666666, "x": "仕事はしている"}, {"t": 208.23333333333332, "x": "団員として呼ばれれば出ていくし、\n任された仕事は落としていないからな"}, {"t": 212.75, "x": "団員としての務めは、\nきちんとこなしている側の\n人間だということだ"}, {"t": 216.88333333333333, "x": "そのキメラアントの一件の場面で、\nカルトが残した一言が今回の芯になる"}, {"t": 222.15, "x": "あの台詞だな"}, {"t": 223.2, "x": "何年かかっても兄さんを\n取り戻す、という短い一言だ"}, {"t": 227.26666666666668, "x": "これだけで十分だ"}, {"t": 228.6, "x": "戦いの最中でも勝ち負けでもなく、\n家族の話を口にしているのが引っかかる"}, {"t": 234.03333333333333, "x": "短いが、この一言だけで入団の\n理由が全部ひっくり返ってしまうぞ"}, {"t": 238.86666666666667, "x": "旅団に入りたかったのではなく、\n旅団を使いたかったことになるからな"}, {"t": 243.48333333333332, "x": "手段だったわけだ"}, {"t": 244.8, "x": "盗賊団の団員という肩書きが、\n目的ではなく道具として置かれている"}, {"t": 249.21666666666667, "x": "家を出たことも、番号を取ったことも、\n全部その一点のためになる"}, {"t": 253.93333333333334, "x": "逆算されている"}, {"t": 255.16666666666666, "x": "目的が先にあって、そこから所属を\n選んでいるという順番になっている"}, {"t": 259.95, "x": "普通は逆だ"}, {"t": 260.95, "x": "何年かかっても、という言い方も\n引っかかるところだと感じないか"}, {"t": 265.3666666666667, "x": "期限を切っていない"}, {"t": 266.6333333333333, "x": "短期で取り返せる相手ではないと、\n本人が最初から分かっている口ぶりだ"}, {"t": 271.53333333333336, "x": "子どもが言う台詞としては、\n覚悟の据わり方が明らかに異常だろ"}, {"t": 275.75, "x": "家の教育か"}, {"t": 276.8, "x": "あの家で育った子どもの発言だと\n考えると、また見え方が変わってくるな"}, {"t": 281.4, "x": "ここで問題になるのが、その兄さんが誰を\n指しているのかという話だな"}, {"t": 286.2, "x": "そこが本題だ"}, {"t": 287.4, "x": "作中では今も明かされていないので、\n断定する話にはできないぞ"}, {"t": 291.9, "x": "いまだに不明だ"}, {"t": 293.05, "x": "だから諸説を並べるだけにしておく。\n答えは出さない方針でいく"}, {"t": 297.6333333333333, "x": "それでいい"}, {"t": 298.31666666666666, "x": "一番よく挙がるのがキルア説で、\nこれは理由が分かりやすい方だな"}, {"t": 302.6333333333333, "x": "キルアは家を出て、外で知り合った\n相手と一緒に行動しているだろ"}, {"t": 306.8333333333333, "x": "取り戻す対象にはなる"}, {"t": 308.46666666666664, "x": "兄弟の中で、家から一番\n遠いところにいる人物ではあるからな"}, {"t": 312.51666666666665, "x": "家を離れた兄という条件だけを見れば、\n確かに一番よく当てはまる"}, {"t": 317.0833333333333, "x": "しかもキルアは弟ではなく兄だから、\n呼び方としても筋が通っている"}, {"t": 321.8, "x": "五人兄弟で、カルトは末っ子だ。\nつまり上は全員が兄になるわけだ"}, {"t": 326.9166666666667, "x": "全員が候補になる"}, {"t": 328.35, "x": "アルカは兄ではないので、\nその一人だけは候補から外れることになるぞ"}, {"t": 332.85, "x": "性別と順番の話だ"}, {"t": 334.71666666666664, "x": "だからキルアに限定する根拠は、\n実のところそこまで強くないんだ"}, {"t": 339.3, "x": "そこが弱点だな"}, {"t": 340.6166666666667, "x": "もう一つが、家族の場面に\n出ていない兄弟がいるという説になる"}, {"t": 344.56666666666666, "x": "まだ出ていない兄弟か"}, {"t": 346.0, "x": "出てくる顔ぶれが常に全員とは\n限らない、という読み方をする説だな"}, {"t": 350.8, "x": "この説を取ると、まだ姿を見せていない\n人物がいることになってくる"}, {"t": 355.4166666666667, "x": "伏線として置いてある"}, {"t": 356.8833333333333, "x": "どちらの説にも、決め手になる描写は\nまだ出てきていないのが現状だ"}, {"t": 361.48333333333335, "x": "はっきりした場面が一つも\n用意されていないので、\n答え合わせができない"}, {"t": 365.98333333333335, "x": "断定して語る人を見かけるが、\n根拠が揃っているとは言いにくいぞ"}, {"t": 370.4, "x": "そこは気をつけたい"}, {"t": 371.65, "x": "分かっているのは、取り戻したい\n相手がいるという事実だけだからな"}, {"t": 375.51666666666665, "x": "分からないまま置かれている状態\nそのものが、仕掛けだと見ている"}, {"t": 379.616666666 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
