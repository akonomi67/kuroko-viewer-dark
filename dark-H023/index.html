6666666667, "i": 680}, {"t": 730.5, "i": 681}, {"t": 731.0166666666667, "i": 682}, {"t": 732.0, "i": 683}, {"t": 733.5, "i": 684}, {"t": 735.0, "i": 685}, {"t": 735.5833333333334, "i": 686}, {"t": 736.5, "i": 687}, {"t": 737.2, "i": 688}, {"t": 738.0, "i": 689}, {"t": 739.5, "i": 690}, {"t": 741.0, "i": 691}, {"t": 742.5, "i": 692}, {"t": 742.9166666666666, "i": 693}, {"t": 744.0, "i": 694}, {"t": 745.5, "i": 695}, {"t": 747.0, "i": 696}, {"t": 747.9333333333333, "i": 697}, {"t": 748.5, "i": 698}, {"t": 749.05, "i": 699}], "subs": [{"t": 0.0, "x": "引用:ハンターハンター\n/富樫義博/週刊少年ジャンプ\n/集英社 /マッドハウス"}, {"t": 0.0, "x": "【ハンターハンター】五大厄災、危険度の\n格付けよりリターンの方がおかしいに\n対する読者の反応集を紹介するよ！"}, {"t": 7.25, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 12.166666666666666, "x": "暗黒大陸の話をすると、\n必ず五大厄災という言葉が出てくるだろ"}, {"t": 17.266666666666666, "x": "名前だけは有名だ"}, {"t": 18.716666666666665, "x": "ただし五つ全部を正確に挙げられる\n読者は、そこまで多くないはずだ"}, {"t": 23.316666666666666, "x": "三つ目あたりで手が止まって、\n残りが出てこなくなるのが普通だろうな"}, {"t": 27.766666666666666, "x": "危険度がどうこうという話ばかりが\n先に来るのも、その理由の一つだな"}, {"t": 32.166666666666664, "x": "今回は危険度ではなく、人類が\n引き換えに受け取った側から並べていく"}, {"t": 37.016666666666666, "x": "リターンの話か"}, {"t": 38.25, "x": "何を差し出して何を受け取ったのか、\nその交換の内訳を見ていく回になる"}, {"t": 43.25, "x": "まず前提として、厄災は事故で\n入ってきたものではないぞ"}, {"t": 47.18333333333333, "x": "こちらから取りに行った結果として、\n勝手に付いてきたものだからな"}, {"t": 51.483333333333334, "x": "五大陸の五つの国が暗黒大陸を\n探索した時に、持ち帰ってしまったものだ"}, {"t": 57.016666666666666, "x": "欲しいものがあって出かけていって、\nおまけが一緒に付いてきた形だな"}, {"t": 61.083333333333336, "x": "買い物の帰りだ"}, {"t": 62.233333333333334, "x": "しかもジンの説明では、案内人が\n戒めのために意図的に持ち帰らせたとある"}, {"t": 67.58333333333333, "x": "つまり最初から\n仕込まれていたことになるわけで、\n事故ですらないんだ"}, {"t": 71.86666666666666, "x": "出入りそのものは見逃すが、代償は\n必ず持たせて返す、という話になる"}, {"t": 77.28333333333333, "x": "向こう側には、こちらのやり方を\n分かっている存在がいるということだぞ"}, {"t": 81.83333333333333, "x": "それが一番怖い"}, {"t": 83.13333333333334, "x": "人間がリターンに弱いことを\n知っている相手が、\n向こうにいるという話だぞ"}, {"t": 87.81666666666666, "x": "では五つを順番に見ていくか。まずは一つ目だ"}, {"t": 90.96666666666667, "x": "読み方から難しい"}, {"t": 92.33333333333333, "x": "名前の並びだけ覚えても意味が薄いので、\n対になる品物とセットで見ていく"}, {"t": 97.46666666666667, "x": "一つ目が、人飼いの獣パプ。\n危険度はAと格付けされている"}, {"t": 102.08333333333333, "x": "名前の響きだけ聞くと生き物なのか\nどうかも分からんが、獣で合っている"}, {"t": 106.95, "x": "こいつと引き換えに\n人類が得たものが、\n無尽石という鉱石だ"}, {"t": 111.1, "x": "水に沈めると発電する石でな。\nビーズ一粒で一日およそ二万キロワット出る"}, {"t": 116.78333333333333, "x": "たった一粒の石が、そこまでの\n出力を出し続けるという話だからな"}, {"t": 121.23333333333333, "x": "一般家庭の使用量に直すと、数千の\n世帯を一粒でまかなえる計算になるぞ"}, {"t": 126.8, "x": "国が一つ抱えている電力の悩みが、\n石ころ数個で片付いてしまうわけだ"}, {"t": 131.86666666666667, "x": "ベゲロセ連合国が千人規模の調査団を\n送って、帰ってきたのは七人だけだ"}, {"t": 137.26666666666668, "x": "九百九十三人が消えた"}, {"t": 139.3, "x": "その代償で、エネルギーの問題を\n一つ片付けたことになるわけだな"}, {"t": 143.85, "x": "二つ目が、双尾の蛇ヘルベル。\nこちらも危険度はAだ"}, {"t": 147.86666666666667, "x": "蛇の方だな"}, {"t": 148.93333333333334, "x": "得られたリターンはニトロ米で、\n寿命に関わる米だと説明されている"}, {"t": 153.16666666666666, "x": "食べ物一つで寿命が動くなら、\n国が本気で取りにいくのも当然だろう"}, {"t": 158.05, "x": "オチマ連邦が人を送り込んだが、\n九十九パーセントは沼地に着く前に食われた"}, {"t": 163.31666666666666, "x": "戦って負けたのではなく、道中で\n削り取られたという書かれ方だからな"}, {"t": 168.28333333333333, "x": "帰還者は十一人だ。米一種類のために、\nそれだけの人数を投じたことになる"}, {"t": 174.16666666666666, "x": "割に合うのか"}, {"t": 175.18333333333334, "x": "寿命が延びる米という言い方も、\nどこまでの効果なのかは書かれていない"}, {"t": 179.8, "x": "三つ目が、ガス生命体アイ。\nこれも危険度はAで並んでいる"}, {"t": 183.73333333333332, "x": "形が無いやつだ"}, {"t": 184.95, "x": "リターンは三原水と呼ばれるもので、\n名前の通り水の一種だな"}, {"t": 189.25, "x": "水を持ち帰るためだけに危険度Aの\n相手に近づいた、という記録になる"}, {"t": 193.83333333333334, "x": "四番目が、不死の病ゾバエ病。\n危険度の格付けは上の三つより下になる"}, {"t": 199.33333333333334, "x": "少し下がる"}, {"t": 200.25, "x": "リターンは錬金植物メタリオン。\nクカンユ王国が持ち帰りに成功している"}, {"t": 205.36666666666667, "x": "そこは成功か"}, {"t": 206.56666666666666, "x": "持ち帰りに失敗した例と、持ち帰った\n後に枯らした例は分けて数えたい"}, {"t": 211.33333333333334, "x": "ところが持ち帰ったメタリオンは、\nその後に枯れてしまって使えていない"}, {"t": 215.41666666666666, "x": "人だけ減って、手元には枯れた植物しか\n残らなかったという結末だな"}, {"t": 220.51666666666668, "x": "代償だけ払って成果が残らなかった、\n五つの中で唯一の失敗例になる"}, {"t": 225.86666666666667, "x": "一番むなしい"}, {"t": 226.9, "x": "持ち帰りの技術と保存の技術は\n別物だ、という教訓にもなっているな"}, {"t": 231.86666666666667, "x": "五番目が、兵器ブリオン。植物の\n兵器で、危険度の格付けも下の側だ"}, {"t": 237.56666666666666, "x": "古い遺跡を守るために置かれていた、\nという説明が付いている相手だな"}, {"t": 242.18333333333334, "x": "リターンは万病に効く香草で、\n薬の話に直結するものだな"}, {"t": 246.41666666666666, "x": "サヘルタ連邦が特殊部隊を送り込んで、\n生還したのは二人だけだった"}, {"t": 251.3, "x": "部隊が消えている"}, {"t": 252.51666666666668, "x": "遺跡を守っている側だから、\n近づかなければ何もしてこないらしいぞ"}, {"t": 257.03333333333336, "x": "守りに徹する側だ"}, {"t": 258.53333333333336, "x": "こちらから踏み込んだ結果として、\n部隊がほぼ消えたということになる"}, {"t": 262.96666666666664, "x": "さて、五つ並べ終わったところで、\nリターンだけを見直してみてくれ"}, {"t": 267.4, "x": "電力と寿命と水と薬か"}, {"t": 269.55, "x": "そこに錬金まで入っているからな。\n現代の課題がほとんど揃っているだろ"}, {"t": 274.71666666666664, "x": "一つでも欲しいものばかりなのに、\nそれが五つ並んでいるのがずるいわ"}, {"t": 278.68333333333334, "x": "人類が長年解けていない問題が、\nそのまま商品棚に並んでいる状態だぞ"}, {"t": 284.15, "x": "しかも一つ持ち帰るごとに、国が\n一つ傾く人数を減らしているのが厳しい"}, {"t": 289.25, "x": "消えている人数の桁が、普通の\n遠征の被害とはまるで違っているぞ"}, {"t": 293.8833333333333, "x": "千人出して七人、九十九パーセントが\n帰らず、部隊で二人生還という数字だ"}, {"t": 299.6, "x": "容赦が無い"}, {"t": 300.48333333333335, "x": "数字を並べ直すと、探索というより\n人身御供に近い記録に見えてくるぞ"}, {"t": 305.4, "x": "それでも五回とも取りに行っていると\nいう事実の方が、私は怖いわ"}, {"t": 309.5, "x": "止まっていない"}, {"t": 310.3666666666667, "x": "危険度を格付けした当人たちが、\nその表を見ても引き返していないぞ"}, {"t": 314.98333333333335, "x": "危ないと書いた本人が、その紙を\n握ったまま次の船を出しているんだ"}, {"t": 319.73333333333335, "x": "つまりあの格付けは、行かない\n理由ではなく行く覚悟の目安なんだ"}, {"t": 324.03333333333336, "x": "使い方が逆だ"}, {"t": 325.35, "x": "リターンが大きすぎて、危険度が\n抑止として機能していないということだな"}, {"t": 329.95, "x": "ここが今回の一番の言いたい部分になる"}, {"t": 332.65, "x": "格付けが負けている"}, {"t": 334.05, "x": "五大厄災を、持ち帰ってしまったものと\n読むと話が小さくなるぞ"}, {"t": 338.23333333333335, "x": "支払った代金の一覧として読み直すと、\n印象がまるごと変わってくる"}, {"t": 342.95, "x": "受け取った代金だと考えた方が、\nジンの説明とも噛み合ってくるだろ"}, {"t": 347.75, "x": "案内人が戒めのために持ち帰らせた、\nという言い方がまさにそれだ"}, {"t": 352.4166666666667, "x": "セットで渡された"}, {"t": 353.73333333333335, "x": "宝と警告が同じ入れ物に収まっていて、\n片方だけ取ることはできない形だ"}, {"t": 359.3333333333333, "x": "都合のいい方だけ抜き取る道は、\n最初から用意されていないわけだな"}, {"t": 363.75, "x": "開ければ両方出てくるし、\n閉じたままなら電力も薬も手に入らない"}, {"t": 367.96666666666664, "x": "究極の交換だ"}, {"t": 369.26666666666665, "x": "電気を諦めるか、化け物を一体抱えるか。\nその二択を五回やった話だぞ"}, {"t": 375.15, "x": "そして現在、持ち帰られた五大厄災は\n国際環境許可庁の地下に保管されている"}, {"t": 380.8833333333333, "x": "国際環境許可庁という名前が\n出てくるあたりも、生々しくて良いわ"}, {"t": 385.6666666666667, "x": "保管という言い方をしている時点で、\n処分はできていないことになるぞ"}, {"t": 389.98333333333335, "x": "倒せていない"}, {"t": 390.93333333333334, "x": "リターンの方はもう社会で\n使われているのに、\n代金の方は残ったままだ"}, {"t": 395.7, "x": "便利な方だけ先に使って、支払いは\n丸ごと先送りにしている状態だぞ"}, {"t": 400.3, "x": "これが五大厄災の一番怖いところで、\n過去の話ではなく今の話になる"}, {"t": 405.6166666666667, "x": "地下にある"}, {"t": 406.3666666666667, "x": "今この瞬間も、既知の世界のどこかに\n五つが置かれているということだな"}, {"t": 411.15, "x": "この五つの国は、暗黒大陸への\n渡航を管理している側でもあるだろ"}, {"t": 415.81666666666666, "x": "渡航の可否を決める権限も、\nその五つの国が握ったままになっているぞ"}, {"t": 420.7, "x": "管理している国が、過去に一番大量に\n持ち帰った当事者でもあるわけだ"}, {"t": 425.6, "x": "自作自演に見える"}, {"t": 426.93333333333334, "x": "渡航を止める理由と、渡航したい理由を\n同じ国が抱え込んでいる形になる"}, {"t": 431.5, "x": "板挟みだな"}, {"t": 432.48333333333335, "x": "だから新しい探索の話が出るたびに、\n必ず揉めることになるんだ"}, {"t": 437.28333333333336, "x": "ビヨンドの隊が動いた時も、\nそこが一番の焦点になっていただろ"}, {"t": 441.81666666666666, "x": "止めたい側がいた"}, {"t": 443.0833333333333, "x": "止めたい側の本音は、危険だからと\nいう理由だけではないかもしれん"}, {"t": 447.3666666666667, "x": "取り分の話だ"}, {"t": 448.68333333333334, "x": "次に持ち帰られるリターンを誰が\n受け取るのか、という争いでもあるからな"}, {"t": 453.3833333333333, "x": "止める側にも渡りたい側にも、\nそれぞれの計算が乗っているというわけだ"}, {"t": 458.1166666666667, "x": "五回の持ち帰りで、既に世界の\n基礎がかなり書き換わっているぞ"}, {"t": 462.0, "x": "電力と寿命と薬が手に入っているなら、\nそのまま国力の差に直結するだろ"}, {"t": 467.6166666666667, "x": "先に手に入れた国と、\nまだ持っていない国の\n差が開く一方になるだろ"}, {"t": 472.3333333333333, "x": "六番目が出てきた時に何が変わるのか、\n正直まったく想像がつかん"}, {"t": 477.23333333333335, "x": "そこが不気味だ"}, {"t": 478.3666666666667, "x": "今度は危険度Aで済まない可能性も、\n当然あると見ておくべきだな"}, {"t": 482.73333333333335, "x": "上がある前提だ"}, {"t": 483.95, "x": "実際、暗黒大陸には五大厄災より上の\n存在がいる書き方をされている"}, {"t": 489.03333333333336, "x": "危険度という物差しそのものが、\n向こうでは通用しない可能性もある"}, {"t": 493.1666666666667, "x": "五つはあくまで、人間界にまで\n入ってきたものの数でしかないからな"}, {"t": 497.76666666666665, "x": "向こうの分は不明だ"}, {"t": 499.21666666666664, "x": "残っている分は数えられていないし、\n名前すら出ていないものもある"}, {"t": 503.4166666666667, "x": "危険度の格付けをやる話は\n世の中に山ほど転がっているだろ"}, {"t": 507.6, "x": "比べるのが好きなんだ"}, {"t": 509.0833333333333, "x": "だが五つのリターンだけを並べる話は、\nあまり見かけないと思わないか"}, {"t": 513.6833333333333, "x": "そっちが本体だ"}, {"t": 514.9833333333333, "x": "危険度は行った後の話で、\nリターンは行く前の話になるからな"}, {"t": 519.3166666666667, "x": "人が動く理由は、いつだって\nリターンの側に置かれているものだ"}, {"t": 522.95, "x": "危険を並べて説得できるなら、\nそもそも一度目で終わっていたはずだ"}, {"t": 527.5833333333334, "x": "千人出して七人しか帰らないと\n分かっていても、次の隊は必ず出るぞ"}, {"t": 532.5, "x": "止められない"}, {"t": 533.35, "x": "石一粒で街の電気がまかなえるなら、\n国は絶対に人を送るだろうからな"}, {"t": 538.4666666666667, "x": "誰かが行く"}, {"t": 539.4, "x": "一国が止まっても、別の国が\n名乗りを上げるだけで話は終わらないだろ"}, {"t": 544.1666666666666, "x": "この構図が、そのまま暗黒大陸編を\n前へ動かす燃料になっているんだ"}, {"t": 549.05, "x": "だから船が出る"}, {"t": 550.2166666666667, "x": "王位継承戦の話も、根っこをたどれば\nこの交換の話につながっていく"}, {"t": 554.8666666666667, "x": "同じ航海の中だ"}, {"t": 556.2333333333333, "x": "船が向かっている先に、六番目が\n待っている可能性もあるわけだからな"}, {"t": 561.0666666666667, "x": "順番で言えばそうだ"}, {"t": 562.4833333333333, "x": "五大厄災を覚え直すなら、\n危険度ではなくリターンで覚えるのが早いぞ"}, {"t": 567.1666666666666, "x": "そっちで繋がる"}, {"t": 568.35, "x": "石、米、水、錬金植物、香草。\nこの五つで全部を呼び出せるからな"}, {"t": 574.55, "x": "得たものの名前から逆に引くと、\n対応する厄災が自然と出てくるからな"}, {"t": 579.45, "x": "名前が難しいのは、意図的に\nそうしてある気配すらあると見ている"}, {"t": 583.75, "x": "発音しにくいやつばかりだ"}, {"t": 585.6, "x": "パプ、ヘルベル、アイ、ゾバエ、\nブリオンという並びだからな"}, {"t": 589.4333333333333, "x": "短い名前が多い"}, {"t": 590.65, "x": "短い名前ほど、中身の説明がされない\nまま置かれている印象があるだろ"}, {"t": 595.5666666666667, "x": "情報が少ない"}, {"t": 596.7333333333333, "x": "説明されていないものが五つ地下にある、\nというのが今の状況になる"}, {"t": 601.2666666666667, "x": "落ち着かない話だ"}, {"t": 602.6833333333333, "x": "中身の分からないものを封じて置く、\nという状態が一番危ういからな"}, {"t": 607.2666666666667, "x": "続きでこのうちのどれかが動いたら、\n話は一段変わってくるはずだぞ"}, {"t": 611.95, "x": "出番待ちだな"}, {"t": 613.0166666666667, "x": "出さないまま終わる可能性もあるが、\n置き方が丁寧すぎると感じている" const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
