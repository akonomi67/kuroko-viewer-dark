76.5, "i": 614}, {"t": 678.0, "i": 615}, {"t": 679.5, "i": 616}, {"t": 680.6666666666666, "i": 617}, {"t": 681.0, "i": 618}, {"t": 682.5, "i": 619}, {"t": 684.0, "i": 620}, {"t": 684.2833333333333, "i": 621}, {"t": 685.5, "i": 622}, {"t": 687.0, "i": 623}, {"t": 688.2666666666667, "i": 624}, {"t": 688.5, "i": 625}, {"t": 690.0, "i": 626}, {"t": 691.5, "i": 627}, {"t": 691.7, "i": 628}, {"t": 693.0, "i": 629}, {"t": 693.3166666666667, "i": 630}, {"t": 694.5, "i": 631}, {"t": 694.55, "i": 632}, {"t": 696.0, "i": 633}, {"t": 697.5, "i": 634}, {"t": 699.0, "i": 635}, {"t": 700.5, "i": 636}, {"t": 701.8166666666667, "i": 637}, {"t": 702.0, "i": 638}, {"t": 703.5, "i": 639}, {"t": 705.0, "i": 640}, {"t": 705.8166666666667, "i": 641}, {"t": 706.5, "i": 642}, {"t": 708.0, "i": 643}, {"t": 709.5, "i": 644}, {"t": 710.7833333333333, "i": 645}, {"t": 711.0, "i": 646}, {"t": 712.5, "i": 647}, {"t": 714.0, "i": 648}, {"t": 714.2166666666667, "i": 649}, {"t": 715.5, "i": 650}, {"t": 717.0, "i": 651}, {"t": 718.0, "i": 652}, {"t": 718.5, "i": 653}, {"t": 720.0, "i": 654}, {"t": 721.5, "i": 655}, {"t": 722.2666666666667, "i": 656}], "subs": [{"t": 0.0, "x": "引用:ハンターハンター\n/富樫義博/週刊少年ジャンプ\n/集英社 /マッドハウス"}, {"t": 0.0, "x": "【ハンターハンター】マチの念糸縫合、攻撃と\n索敵と治療を1つの発で兼ねている旅団唯一の性能\nに対する読者の反応集を紹介するよ！"}, {"t": 9.233333333333333, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 14.15, "x": "マチの能力って、名前は知られてるのに中身を\n説明できる人が少ないだろ。念糸縫合と言われて\n絵が浮かぶ人がどれだけいるかという話だ"}, {"t": 23.55, "x": "糸を出すやつ、で止まってる人がほとんどだからな"}, {"t": 26.916666666666668, "x": "出せる糸の使い道が三つあって、\nそのどれもが別の役目を持ってるんだよ。\n攻撃と索敵と治療が一本の糸で繋がってるわけだ"}, {"t": 35.86666666666667, "x": "縛る、追う、繋ぐ。この三つを\n一つの発でやってるわけだ"}, {"t": 40.45, "x": "器用すぎるだろ"}, {"t": 41.583333333333336, "x": "便利屋みたいな扱いだわ"}, {"t": 43.166666666666664, "x": "便利屋と言うと軽く聞こえるが、\n旅団に一人しかいない役だぞ。\n同じことができる団員が他に見当たらないからな"}, {"t": 50.78333333333333, "x": "他の団員は自分の得意な\n一手しか持っていないからな"}, {"t": 54.36666666666667, "x": "攻撃専門の能力者は、戦いが終わった時点で\n手が空くんだよ。倒した後に何をするかまで\n含めて能力を持ってる人は少ないだろ"}, {"t": 63.55, "x": "この人の場合は終わってからの仕事が多いだろ"}, {"t": 66.41666666666667, "x": "糸の細さと強さが釣り合っていないところが、\nまず反則なんだよ。細いほど弱いと\nいう常識をそのまま無視してるわけだ"}, {"t": 74.61666666666666, "x": "見た目は縫い糸なのに、\n締め上げられたら人は\n動けなくなるからな"}, {"t": 78.81666666666666, "x": "天空闘技場で両腕を切り落とされた男を、\nその場で縫い戻したのがこの糸だぞ。\nカストロ戦の後始末を一人でやってるだろ"}, {"t": 87.21666666666667, "x": "血管も骨も筋肉も神経も、\nほぼ全部つないだと説明されてるだろ"}, {"t": 92.23333333333333, "x": "医者いらずだな"}, {"t": 93.25, "x": "手術室が歩いてるわ"}, {"t": 94.68333333333334, "x": "手が残像になるくらいの速さで縫うという描き方が、\n地味に恐ろしいところだ。速く動く能力ではなく、\n手先の技術としてやってるからな"}, {"t": 104.26666666666667, "x": "速さが足りなければ\n間に合わない場面ばかりだからな"}, {"t": 107.53333333333333, "x": "縫った後で、組織が完全にくっつくまで\n無理をするなと釘まで刺してるだろ。\n予後の管理まで口を出す治療役だぞ"}, {"t": 115.15, "x": "完治まで面倒を見る言い方をしていて、\n応急処置で終わっていないんだよ"}, {"t": 119.68333333333334, "x": "ヨークシンでは、攫われた仲間に\n刺した針を頼りに居場所を追ってるだろ。\n連れ去られた先まで辿れる仕組みだ"}, {"t": 126.88333333333334, "x": "あれが索敵の使い方だ。糸を\n伸ばして道しるべにしてるわけだ"}, {"t": 131.45, "x": "追跡役を別の団員に頼まなくていいと\nいうのが、団としては大きい話なんだよ。\n人を割かずに探せるからな"}, {"t": 139.15, "x": "一人で完結してるだろ"}, {"t": 140.81666666666666, "x": "人手が要らないのが強いわ"}, {"t": 142.4, "x": "団長がこの人の勘を当てにしているのも、\nそのあたりが理由だと言われてるぞ。\n判断が早い人間は現場で重宝されるだろ"}, {"t": 150.68333333333334, "x": "勘という言葉で片付けられがちだが、\n根拠は糸から来ているはずだ"}, {"t": 155.18333333333334, "x": "縛る糸と追う糸と縫う糸が、全部同じ一本から\n出ているのが効率の良さだろ。\n別々の技として覚える必要がないわけだ"}, {"t": 163.66666666666666, "x": "系統を増やさずに役割だけ増やしてるからな"}, {"t": 166.63333333333333, "x": "一つの発で三役やろうとすると、\nたいていは全部が中途半端になるんだよ。\n器用貧乏という言葉があるくらいだからな"}, {"t": 174.76666666666668, "x": "それなのに縫合の精度だけは\n異様に高いのが分からないところだ"}, {"t": 178.9, "x": "変化系だったよな"}, {"t": 180.31666666666666, "x": "糸に変えてるだけだわ"}, {"t": 181.8, "x": "オーラを糸の形に変えるという発想自体は、\nそこまで珍しくないんだよ。\n変化系の中では素直な使い方だろ"}, {"t": 188.93333333333334, "x": "珍しいのは、その糸に人体を扱わせているところだ"}, {"t": 192.4, "x": "物を縛る道具として使う人は他にもいるが、\n体の中身まで触る人は他にいないだろ。\n針と糸を医療の道具として持ってきてるわけだ"}, {"t": 201.68333333333334, "x": "触るどころか、切れたものを元に戻してるからな"}, {"t": 205.08333333333334, "x": "旅団の戦い方は、基本的に壊すほうに\n寄ってるんだよ。ウボォーギンも\nフィンクスも壊す側の担当だろ"}, {"t": 212.3, "x": "その中に一人だけ、戻す側の\n人間が混ざってるわけだ"}, {"t": 216.3, "x": "バランスが良いだろ"}, {"t": 217.55, "x": "組み合わせが上手いわ"}, {"t": 218.85, "x": "壊す人間ばかり集めた集団は、\n一回大きく崩れたら立て直せないんだよ。\n修理の担当が居ないと消耗する一方だからな"}, {"t": 227.51666666666668, "x": "補修する人間が一人いるだけで、\n続けられる回数が変わってくるからな"}, {"t": 232.31666666666666, "x": "盗みを仕事にしている以上、怪我をしても\n病院には行けないだろ。表の医者に\n体を見せた時点で足が付くわけだ"}, {"t": 239.3, "x": "その事情を考えると、この人の\n存在は生命線に近いんだよ"}, {"t": 243.35, "x": "病院に行けない集団というのは、\n想像以上に不便な組織だぞ"}, {"t": 247.75, "x": "身分を出した瞬間に終わる仕事をしてるからな"}, {"t": 250.71666666666667, "x": "だから内側に治療役を置いてるわけだ"}, {"t": 253.28333333333333, "x": "外注できない仕事だわ"}, {"t": 255.01666666666668, "x": "外注できない役をやっている人は、\n辞められないんだよ"}, {"t": 258.6, "x": "抜けられない立場だと言い換えてもいいところだ"}, {"t": 261.3833333333333, "x": "本人がそれを重荷だと言っている場面は無いだろ"}, {"t": 264.3833333333333, "x": "黙ってやってるのが、この人の\n性格が出ているところだな"}, {"t": 268.3, "x": "口数が少ないキャラが、いちばん多くの\n仕事を抱えているという構図なんだよ。\n旅団の会議でも発言はそこまで多くないだろ"}, {"t": 275.8, "x": "目立たない人ほど作業量が\n多いのは、現実でもよくある話だぞ"}, {"t": 279.8666666666667, "x": "天空闘技場に呼び出されて、\n腕を縫うためだけに来てるだろ"}, {"t": 283.85, "x": "呼べば来るという時点で、\n関係の深さが分かるわけだ"}, {"t": 287.5, "x": "呼ばれて来る側なんだよな"}, {"t": 289.23333333333335, "x": "呼ぶ側じゃないだろ"}, {"t": 290.48333333333335, "x": "呼ばれて来る側の人間は、たいてい断らないんだよ"}, {"t": 294.0, "x": "断らないから、また呼ばれる。\nそういう回り方が続いてきたわけだ"}, {"t": 298.8333333333333, "x": "その関係が長く続いた結果、二人の距離を\n勘違いする読者が増えたんだよ。恋愛の\n話として読みたくなる形になってるからな"}, {"t": 307.93333333333334, "x": "近いように見えて、本人は\n仕事として来ているだけだろ"}, {"t": 311.55, "x": "仕事として来ている相手に、あそこまで\n手間をかけるかという話もあるんだけどな"}, {"t": 316.15, "x": "そこは読む人によって受け取り方が割れるところだ"}, {"t": 319.01666666666665, "x": "割れるように書いてあるだろ"}, {"t": 320.6333333333333, "x": "答えは出てないんだよな"}, {"t": 322.2, "x": "答えを出さないまま置いておくと、\nその関係は長持ちするんだよ"}, {"t": 326.4, "x": "作り手が一番よく分かってるところだと思うわ"}, {"t": 329.43333333333334, "x": "天空闘技場の一件で有名になった\n一方で、余計な誤解も広まったんだよ"}, {"t": 334.75, "x": "あの復活を、この人が縫った\nおかげだと思ってる人が多いだろ"}, {"t": 338.8666666666667, "x": "最後に倒れた男が戻ってきた件は、\n縫合とは全く別の話だぞ"}, {"t": 343.8666666666667, "x": "あれは本人が自分の能力で\n仕込んでいた結果だからな"}, {"t": 347.4, "x": "勘違いしやすいだろ"}, {"t": 348.75, "x": "並べて置いてあるからな"}, {"t": 350.3, "x": "時系列が近いところに二つの出来事が\n並んでいると、人はまとめて覚えるんだよ。\n縫った直後に立ち上がられたら、そう見えて当然だろ"}, {"t": 359.53333333333336, "x": "実際は繋がっていないのに、\n因果があるように見えるわけだ"}, {"t": 363.31666666666666, "x": "本人はむしろ、あの場では手を出していないだろ"}, {"t": 366.3333333333333, "x": "むしろ後で怒っているだろ。\n勝手に決着を付けられた側だからな"}, {"t": 371.03333333333336, "x": "縫う相手を選ぶ人でもあると\nいうことが、あそこで分かるんだよ"}, {"t": 374.8666666666667, "x": "誰にでも針を出す訳ではないと\nいう線引きがあるわけだ"}, {"t": 378.35, "x": "線引きがあるだろ"}, {"t": 379.55, "x": "無条件じゃないだろ"}, {"t": 380.76666666666665, "x": "無条件の回復役がいる集団は、話が緩くなるんだよ"}, {"t": 384.9166666666667, "x": "条件が付いているからこそ、緊張感が残るわけだ"}, {"t": 388.65, "x": "実際、旅団の誰かが大怪我をしたときに\n毎回間に合っている訳ではないだろ。\n呼ばれた時点で手遅れだった回もあるからな"}, {"t": 396.8, "x": "間に合わなかった回のほうが\n記憶に残っているくらいだからな"}, {"t": 400.55, "x": "ウボォーギンの件では、\n追いつく前に決着していたわけだ"}, {"t": 404.23333333333335, "x": "糸で場所は分かっても、\n距離までは縮められないんだよ"}, {"t": 407.76666666666665, "x": "そこが唯一の穴なんだよな"}, {"t": 409.71666666666664, "x": "足の速さは普通だろ"}, {"t": 411.25, "x": "移動の能力を持っていない以上、\n情報が先に届いても間に合わないんだよ。\n場所が分かることと辿り着くことは別だからな"}, {"t": 418.73333333333335, "x": "索敵と移動が別の人の\n担当になっているのが、\nあの団の弱点だったわけだ"}, {"t": 423.51666666666665, "x": "コルトピとシャルナークが抜けた後の\n話をすると、余計にそこが目立つだろ"}, {"t": 428.43333333333334, "x": "情報を取る役が減った分、\n糸の価値は上がってるはずだ"}, {"t": 432.21666666666664, "x": "今の旅団で、後方の仕事を一人で\n回せるのはこの人だけだろうな"}, {"t": 436.76666666666665, "x": "回せる人が一人しかいない組織は、\nその一人が抜けたら止まるぞ"}, {"t": 441.0833333333333, "x": "止まるだろ"}, {"t": 441.8833333333333, "x": "代わりがいないわ"}, {"t": 442.95, "x": "代わりがいない役というのは、\n評価されないまま重要になっていくんだよ"}, {"t": 447.3666666666667, "x": "誰も担当を変わりたがらないからな"}, {"t": 449.75, "x": "戦闘力で並べたら、団の中では上の\nほうではないだろ。正面からの\n殴り合いを任される人ではないからな"}, {"t": 456.5, "x": "ウボォーギンやフィンクスと比べたら、\n正面からの数字は落ちるからな"}, {"t": 460.46666666666664, "x": "それでも欠けたら困る順で\n並べ直すと、順位が入れ替わるんだよ"}, {"t": 464.75, "x": "強さの物差しを変えると、序列も変わるわけだ"}, {"t": 468.0833333333333, "x": "物差しの話だな"}, {"t": 469.6, "x": "測り方の問題だわ"}, {"t": 471.23333333333335, "x": "測り方を一つしか持っていないと、\nこういう人を見落とすんだよ"}, {"t": 475.28333333333336, "x": "見落とした結果、地味なキャラと\nいう評価で止まるからな"}, {"t": 478.8833333333333, "x": "この作品は、そういう物差しの入れ替えを\n何度もやってるだろ。念の系統も強さの\n順位も、途中で意味が変わってくるからな"}, {"t": 487.4, "x": "強さの話をしているようで、\n別の価値を並べてくるわけだ"}, {"t": 491.4166666666667, "x": "糸の能力そのものは、派手さで\n言えば下から数えたほうが早いんだよ"}, {"t": 495.6, "x": "それでも作中で一番使い回しの\n利く発だという評価は動かないぞ"}, {"t": 499.68333333333334, "x": "使い道が多い能力は、\n話を作るうえでも便利なんだよ"}, {"t": 503.6666666666667, "x": "便利すぎると壊れるから、制限を付けてあるわけだ"}, {"t": 507.15, "x": "制限があるだろ"}, {"t": 508.3, "x": "万能じゃないんだよな"}, {"t": 509.75, "x": "切れてすぐの傷なら戻せるが、時間が\n経ったものはどうにもならない扱いだろ。\n何でも治せる能力にはしていないわけだ"}, {"t": 517.8, "x": "その線引きがあるから、緊急時の\n緊張が消えていないんだよ"}, {"t": 521.8666666666667, "x": "念の量にも限りがある以上、\n無限に縫えるわけでもないだろ"}, {"t": 525.7333333333333, "x": "一日に何人も治せる書かれ方はしていないからな"}, {"t": 529.1666666666666, "x": "そこを都合よく書かなかったのが、\nこの作品の真面目なところだ"}, {"t": 533.05, "x": "回復役を出した瞬間に緊張が\n消える漫画は多いんだよ"}, {"t": 536.5, "x": "消えてないだろ"}, {"t": 537.5, "x": "むしろ増えてるわ"}, {"t": 538.6166666666667, "x": "治せる人がいると分かった状態で、\n間に合わない場面を作るほうが効くんだよ。\n助かる道があるのに閉じるのが一番きついだろ"}, {"t": 546.8833333333333, "x": "可能性があるのに届かないと\nいう形が、いちばん重いからな"}, {"t": 551.05, "x": "そう考えると、この人は話の緊張を\n作る側の装置でもあるんだよ"}, {"t": 555.8833333333333, "x": "治す役なのに、緊張を増やしてるわけだ"}, {"t": 558.8166666666667, "x": "うまい配置だな"}, {"t": 559.9166666666666, "x": "役割が二重になってるわ"}, {"t": 561.5666666666667, "x": "一人のキャラに役割を二つ持たせると、\n出番が少なくても印象が残るんだよ。\n治す役と縛る役を同時に背負ってるからな"}, {"t": 570.0666666666667, "x": "出番の少なさを能力の広さで\n埋めているのが、この人の作りだからな"}, {"t": 574.9, "x": "実際、登場した回数はそんなに多くないだろ"}, {"t": 578.1833333333333, "x": "多くないのに、旅団の話をすると\n必ず名前が出てくるわけだ"}, {"t": 582.5166666666667, "x": "名前が出てくる回数と、出番の\n回数が釣り合っていないキャラだぞ"}, {"t": 586.8833333333333, "x": "それは書き方が上手いということの証明でもあるだろ"}, {"t": 590.1166666666667, "x": "針を出す仕草が印象に残るように作ってあるんだよ"}, {"t": 593.5666666666667, "x": "道具を一つ持たせておくと、\nそれだけで思い出してもらえるからな"}, {"t": 597.7166666666667, "x": "覚えやすいだろ"}, {"t": 598.75, "x": "道具が分かりやすいわ"}, {"t": 600.0833333333334, "x": "能力の絵面が単純な人ほど、\n読者の記憶には長く残るんだよ。針を\n一本立てるだけで、誰の場面か分かるだろ"}, {"t": 608.5333333333333, "x": "複雑な能力は説明が要るぶん、\n思い出す手間がかかるからな"}, {"t": 612.8, "x const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
