, {"t": 717.0, "i": 676}, {"t": 718.5, "i": 677}, {"t": 720.0, "i": 678}, {"t": 721.0666666666667, "i": 679}, {"t": 721.5, "i": 680}, {"t": 723.0, "i": 681}, {"t": 724.5, "i": 682}, {"t": 726.0, "i": 683}, {"t": 726.1, "i": 683}], "subs": [{"t": 0.0, "x": "引用:ハンターハンター\n/富樫義博/週刊少年ジャンプ\n/集英社 /マッドハウス"}, {"t": 0.0, "x": "【ハンターハンター】ゴンを育てたミト、\nジンから養育権を裁判で勝ち取った一般人に\n対する読者の反応集を紹介するよ！"}, {"t": 7.966666666666667, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 12.883333333333333, "x": "ミトさんの作中での立ち位置を、\n正確に説明できる読者は意外と少ないだろ"}, {"t": 18.25, "x": "おばさん枠で止まってる"}, {"t": 19.8, "x": "ゴンを育てた人、というところで\n説明が終わってしまっている人が多いわ"}, {"t": 24.466666666666665, "x": "血縁で言うと、ゴンの父親であるジンの\n従姉妹にあたる人物だぞ"}, {"t": 28.733333333333334, "x": "つまりいとこだ"}, {"t": 29.766666666666666, "x": "ゴンから見れば、父親のいとこに\nあたる相手ということになるだろ"}, {"t": 33.483333333333334, "x": "呼び方がおばさんなので、母でも\n姉でもない位置が伝わりにくくなっている"}, {"t": 38.233333333333334, "x": "関係が特殊だ"}, {"t": 39.583333333333336, "x": "ゴンの家にはミトさんの\n他におばあさんもいて、\n女手だけで回している家だぞ"}, {"t": 44.45, "x": "島の暮らしを支えながら、子どもを\n一人育てているという状況になるわけだ"}, {"t": 49.483333333333334, "x": "負担は大きい"}, {"t": 50.43333333333333, "x": "島の外に頼れる相手がいない環境で、\n十二年以上それを続けている人だぞ"}, {"t": 55.78333333333333, "x": "しかも育ての親であって、ゴンを\n産んだ人ではないという点も外せないぞ"}, {"t": 60.35, "x": "この整理をしないまま話すと、後から\n出てくる裁判の話が効かなくなるからな"}, {"t": 65.16666666666667, "x": "裁判が本題だ"}, {"t": 66.38333333333334, "x": "あの事実で印象が一気に変わった\n読者は、かなりの数がいるはずだ"}, {"t": 71.0, "x": "この作品は強さを念で測る話なのに、\nミトさんはその物差しの外側にいるだろ"}, {"t": 76.76666666666667, "x": "念能力者ではない"}, {"t": 78.28333333333333, "x": "修行の描写も無いし、戦った場面も\n一つも用意されていないぞ"}, {"t": 82.75, "x": "その完全な一般人が、この話の中でどれだけ\n重い仕事をしてきたかという回だ"}, {"t": 88.4, "x": "今回はそこを見る"}, {"t": 89.7, "x": "戦っていないだけで、この人が\n決めてきたことの重さは相当なものだからな"}, {"t": 94.83333333333333, "x": "主人公がハンターになるかどうかを、\n実際に握っていた人物でもあるぞ"}, {"t": 99.2, "x": "入口の門番だ"}, {"t": 100.41666666666667, "x": "あの島から出さないと決めていれば、\nこの物語は一話で止まっていたことになる"}, {"t": 105.63333333333334, "x": "極端な話ではない"}, {"t": 107.23333333333333, "x": "まずはクジラ島での育て方から順番に見ていくか"}, {"t": 110.65, "x": "そこからだな"}, {"t": 111.66666666666667, "x": "ゴンは赤ん坊のうちから\nクジラ島に置かれて、\nそこで育てられている"}, {"t": 116.06666666666666, "x": "父親のジンは島を出ていて、育児には\n一切関わっていない状態だからな"}, {"t": 121.01666666666667, "x": "最初から不在だ"}, {"t": 122.31666666666666, "x": "そしてミトさんは、ゴンに両親は\n事故で亡くなったと伝え続けていた"}, {"t": 126.81666666666666, "x": "生きている父親を、\nもういないことにしていたわけだからな"}, {"t": 130.06666666666666, "x": "隠していたわけだ"}, {"t": 131.23333333333332, "x": "ただしこれを悪意で片付けると、\nこの人の読み方を完全に間違えるぞ"}, {"t": 136.0, "x": "追いかける相手がいると分かってしまえば、\n子どもは必ず追いかけるだろ"}, {"t": 140.41666666666666, "x": "それはそうだ"}, {"t": 141.35, "x": "家を出ていった父親の話をすれば、\n次の日には荷造りが始まる年頃だからな"}, {"t": 146.9, "x": "島を出ていく理由を先に潰しておいた、\nという見方ができる作りだろ"}, {"t": 151.43333333333334, "x": "実際ゴンは、父親が生きていると\n知った瞬間に試験を受けにいっただろ"}, {"t": 156.06666666666666, "x": "予測が当たってる"}, {"t": 157.31666666666666, "x": "そもそも父親が生きているという事実を、\n最初に告げたのもミトさん本人だぞ"}, {"t": 162.01666666666668, "x": "ゴンが引かないと分かった時点で、\n隠し通すのをやめて全部渡しているわけだ"}, {"t": 166.96666666666667, "x": "腹をくくってる"}, {"t": 168.05, "x": "心配が形になってしまったという意味では、\n判断の精度が高すぎたわけだ"}, {"t": 173.25, "x": "育て方そのものは、\nかなり自由にやらせているのが\n面白いところだぞ"}, {"t": 177.95, "x": "放任ではある"}, {"t": 178.96666666666667, "x": "森に入るのも釣りをするのも、\n危ないからという理由で止めていない"}, {"t": 183.18333333333334, "x": "危険な生き物が普通にいる島で、\n子どもを外に出し続けているからな"}, {"t": 187.8, "x": "肝が据わってる"}, {"t": 188.95, "x": "締めるところと緩めるところが、\nこの人ははっきり分かれているんだ"}, {"t": 192.81666666666666, "x": "ゴンの体力と勘の良さは、あの島の\n環境で作られたと考えていいだろ"}, {"t": 197.75, "x": "土台は島だな"}, {"t": 198.93333333333334, "x": "釣りの腕も森での立ち回りも、あの島の\n外では身につかないものばかりだからな"}, {"t": 204.16666666666666, "x": "学校の成績の話がほとんど出てこないのも、\nこの家の方針を表しているぞ"}, {"t": 209.58333333333334, "x": "育て方の方針が、結果として\nハンター向きの人間を仕上げてしまっている"}, {"t": 214.56666666666666, "x": "皮肉な話だ"}, {"t": 215.83333333333334, "x": "山も海も好きにさせた結果、島の外でも\n通用する体が出来上がってしまった"}, {"t": 221.38333333333333, "x": "出したくない道の適性を、自分の手で\n伸ばしてしまったことになるからな"}, {"t": 225.71666666666667, "x": "そのうえで、島から出ていく条件を\nきちんと付けているのが上手いんだ"}, {"t": 230.05, "x": "ハンター試験を受けたいと言い出した時、\nミトさんは当然反対しているぞ"}, {"t": 234.65, "x": "止めにかかった"}, {"t": 235.76666666666668, "x": "ただし頭ごなしに禁止したわけではなく、\n条件を一つ出しているのが違う"}, {"t": 240.78333333333333, "x": "湖のヌシを釣り上げたら認める、\nという取引を先に置いたわけだな"}, {"t": 245.33333333333334, "x": "これが上手い"}, {"t": 246.15, "x": "禁止だと言えば言い争いになるが、\n条件なら子どもの側が納得するだろ"}, {"t": 251.08333333333334, "x": "無理そうな課題を一つ置くだけで、\n話し合いを終わらせてしまっている"}, {"t": 254.96666666666667, "x": "交渉が成立してる"}, {"t": 256.3666666666667, "x": "そして実際、ゴンはヌシを釣り上げて\n約束通りに送り出されているぞ"}, {"t": 260.9, "x": "感情で止めずに条件で\n止めようとしたところが、\nこの人の大人な部分だ"}, {"t": 265.78333333333336, "x": "約束は守った"}, {"t": 267.1333333333333, "x": "ジンが島に残していった荷物を\n預かっていたのも、ミトさんの側だ"}, {"t": 271.65, "x": "渡す時期を自分で決められる立場にいたのに、\nきちんと本人に渡しているぞ"}, {"t": 276.6166666666667, "x": "握り潰していない"}, {"t": 277.8833333333333, "x": "ゴンがキルアを連れて島に帰ってきた時も、\n文句を言わずに迎え入れているだろ"}, {"t": 282.8333333333333, "x": "息子が連れてきた相手を、身元も\n聞かずに家へ上げる度胸はなかなか無い"}, {"t": 286.93333333333334, "x": "器がでかい"}, {"t": 287.8, "x": "相手がゾルディック家の子どもだと\n知らされないまま、普通に食事を出している"}, {"t": 292.5833333333333, "x": "知っていたら卒倒する"}, {"t": 294.18333333333334, "x": "さて、この人の一番\n大きな事実がここからになるわけだ"}, {"t": 298.18333333333334, "x": "裁判の話だな"}, {"t": 299.6, "x": "ミトさんは、ジンと裁判で争って\nゴンの養育権を勝ち取っているんだ"}, {"t": 304.2, "x": "クジラ島の一般人が、プロハンターを\n相手に法廷で勝ったことになる"}, {"t": 308.8666666666667, "x": "とんでもない話だ"}, {"t": 310.26666666666665, "x": "相手はあのジンだからな。逃げも\n隠れも自在にやってのける人間だぞ"}, {"t": 314.96666666666664, "x": "その相手を、逃げることができない\n場所に引きずり出したわけだ"}, {"t": 318.48333333333335, "x": "土俵を変えた"}, {"t": 319.4166666666667, "x": "殴り合いなら勝ち目は無いが、書類と\n法廷なら念の有無は関係なくなるからな"}, {"t": 324.6333333333333, "x": "条件を揃えた"}, {"t": 325.8833333333333, "x": "念も戦闘力も一切使わずに、制度の\n側から取りにいっているのが強いんだ"}, {"t": 331.06666666666666, "x": "この作品の中で、\nこの勝ち方をしている人物は\n他に見当たらないぞ"}, {"t": 335.8, "x": "前例が無い"}, {"t": 336.71666666666664, "x": "協会の助けも念の技術も借りずに、\n手続きだけで押し切った例になる"}, {"t": 341.53333333333336, "x": "しかも勝ちにいった理由が、自分が\n育てたいからという一点だけだからな"}, {"t": 346.28333333333336, "x": "誰かに頼まれたわけでも、報酬が\n用意されているわけでもないだろ"}, {"t": 350.26666666666665, "x": "完全な持ち出しだ"}, {"t": 351.5833333333333, "x": "十年以上を報酬なしで続けていると\nいう意味では const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
