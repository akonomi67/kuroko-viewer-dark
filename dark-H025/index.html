": 679}, {"t": 726.0, "i": 680}, {"t": 727.5, "i": 681}, {"t": 729.0, "i": 682}, {"t": 729.2, "i": 683}, {"t": 730.5, "i": 684}, {"t": 730.85, "i": 685}, {"t": 732.0, "i": 686}, {"t": 733.5, "i": 687}, {"t": 735.0, "i": 688}, {"t": 735.3666666666667, "i": 689}, {"t": 736.5, "i": 690}, {"t": 736.8166666666667, "i": 691}, {"t": 738.0, "i": 692}, {"t": 739.5, "i": 693}, {"t": 741.0, "i": 694}, {"t": 741.7666666666667, "i": 695}], "subs": [{"t": 0.0, "x": "引用:ハンターハンター\n/富樫義博/週刊少年ジャンプ\n/集英社 /マッドハウス"}, {"t": 0.0, "x": "【ハンターハンター】ハンターライセンスの\n特典、司法上の扱いだけ釣り合っていないに\n対する読者の反応集を紹介するよ！"}, {"t": 7.516666666666667, "x": "ぜひ最後まで見て\n高評価とコメント残してね！\nそれでは本編へどうぞ！"}, {"t": 12.433333333333334, "x": "ハンター試験に受かると何がもらえるのか、\n正確に言える読者は少ないだろ"}, {"t": 17.35, "x": "カード一枚だな"}, {"t": 18.566666666666666, "x": "あの一枚に付いてくる特典を、\n今回は順番に並べて検算していく"}, {"t": 23.35, "x": "一覧を眺めるだけなら知っている人も\n多いが、並べ替えると景色が変わるぞ"}, {"t": 28.283333333333335, "x": "先に言っておくと、性質の違うものが\n一つ紛れ込んでいるという話だ"}, {"t": 32.666666666666664, "x": "まずは移動まわりの特典からだな。\nここが一番よく知られている部分だ"}, {"t": 37.6, "x": "民間人が入国を禁止されている国の、\nおよそ九十パーセントに入れる"}, {"t": 42.4, "x": "割合が高すぎる"}, {"t": 43.75, "x": "入れない国の方が例外になる、\nという言い方をしても間違いではないぞ"}, {"t": 48.25, "x": "さらに立入禁止区域の\n七十五パーセントまで、\nそのまま入っていけるらしい"}, {"t": 53.233333333333334, "x": "数字で言われるとさらっと流れてしまうが、\nこれは相当おかしな話だぞ"}, {"t": 58.0, "x": "この二つは後でもう一度戻ってくるので、\n頭の隅に置いておいてくれ"}, {"t": 62.21666666666667, "x": "そして施設まわりの特典だな。\nこちらは分かりやすい優遇の側に入る"}, {"t": 67.21666666666667, "x": "公的施設の九十五パーセントが\n無料で使えるという説明が付いている"}, {"t": 71.9, "x": "ほぼ全部だ"}, {"t": 72.81666666666666, "x": "図書館も交通も、行政が持っている施設の\nほとんどが対象になるからな"}, {"t": 77.95, "x": "交通機関を優先的に予約できると\nいう話も、あわせて出てきている"}, {"t": 82.65, "x": "大学の受講料が免除されると\nいう記述もあって、学費がかからなくなる"}, {"t": 87.6, "x": "移動と生活と学びまで、ここまでで\n生活費の大半が消えている計算になる"}, {"t": 92.43333333333334, "x": "ここまでは、割引と優先という言葉で\nまとめられる範囲に収まっているぞ"}, {"t": 97.3, "x": "お金まわりの特典も相当なもので、\n銀行からの融資の条件が変わってくる"}, {"t": 102.58333333333333, "x": "一流企業と同じ条件で融資を受けられる、\nという説明が付いているんだ"}, {"t": 107.43333333333334, "x": "個人にその扱いか"}, {"t": 108.96666666666667, "x": "返せる根拠が本人の資格しか無いのに、\n条件だけは一流の扱いになる"}, {"t": 114.08333333333333, "x": "実績も担保も無い個人が、大企業と\n同じ土俵で金を借りられるわけだ"}, {"t": 119.1, "x": "カードそのものの値段も、\nこの作品でよく話題になる部分だろ"}, {"t": 122.93333333333334, "x": "七代のやつだな"}, {"t": 124.13333333333334, "x": "売れば七代は遊んで暮らせる、\nという言い方で価値が示されている"}, {"t": 128.38333333333333, "x": "持っているだけでも一生何不自由なく\n暮らせる、とも書かれているぞ"}, {"t": 132.73333333333332, "x": "働かなくていい"}, {"t": 133.91666666666666, "x": "危険な仕事に就くための資格が、\n働かなくていい権利も兼ねているんだ"}, {"t": 138.76666666666668, "x": "ねじれている"}, {"t": 139.63333333333333, "x": "情報の特典もあって、ハンター専用の\n場所にアクセスできるようになる"}, {"t": 144.31666666666666, "x": "一般には出回らない情報を取りに行ける、\nというのが実務では一番大きい"}, {"t": 149.11666666666667, "x": "仕事道具だな"}, {"t": 150.26666666666668, "x": "依頼も資料も、その情報網を\n経由して集めることになるからな"}, {"t": 154.25, "x": "それから再発行の話も外せない。\nここもかなり重い条件だからな"}, {"t": 159.38333333333333, "x": "紛失しても盗まれても、\n再発行はされないと\nいう扱いになっているんだ"}, {"t": 164.21666666666667, "x": "一枚きりだ"}, {"t": 165.23333333333332, "x": "無くしたら終わりという条件が、\n価値をさらに押し上げているわけだな"}, {"t": 169.45, "x": "だからこそ、売った時の値段が\n跳ね上がる仕組みにもなっているだろ"}, {"t": 173.71666666666667, "x": "供給が絞られてる"}, {"t": 175.16666666666666, "x": "世の中に出回る枚数が増えないので、\n値段が落ちる理由が無いわけだな"}, {"t": 179.83333333333334, "x": "さて、ここまで並べたものを\n性質ごとに分けてみてほしい"}, {"t": 183.28333333333333, "x": "分類するのか"}, {"t": 184.33333333333334, "x": "誰が負担しているのかで分けると、\nきれいに二つの山に割れるはずだ"}, {"t": 188.75, "x": "施設が無料、優先予約、学費免除、\n融資の条件。これは全部が優遇だ"}, {"t": 194.88333333333333, "x": "お金と手間の話だな"}, {"t": 196.6, "x": "情報網の閲覧権も、協会が\n持っているものを分けてもらう形になる"}, {"t": 201.55, "x": "売値の話に至っては、\n単に希少だから高いと\nいうだけの話だろ"}, {"t": 206.26666666666668, "x": "数が少なくて欲しがる人間が多ければ\n値段は上がる、というだけの話だな"}, {"t": 211.26666666666668, "x": "どれも協会が自前で用意できる範囲に、\nきれいに収まっているだろ"}, {"t": 215.21666666666667, "x": "ところが入国と立入の二つだけ、\n明らかに性質が違っているんだ"}, {"t": 220.03333333333333, "x": "そこが本題だな"}, {"t": 221.35, "x": "入国禁止というのは、その国が\n法律で止めているものになるだろ"}, {"t": 225.71666666666667, "x": "主権の話になる"}, {"t": 227.11666666666667, "x": "誰を入れて誰を入れないかは、\nその国が自分で決めることだからな"}, {"t": 231.45, "x": "立入禁止区域も、誰かが権限を\n持って線を引いているということだ"}, {"t": 236.06666666666666, "x": "その線を、協会が発行した\nカード一枚が飛び越えてしまっている"}, {"t": 240.45, "x": "越権に近い"}, {"t": 241.48333333333332, "x": "国が引いた線を、外部の組織が\n発行した紙で越えられる形になっている"}, {"t": 246.08333333333334, "x": "これは割引ではないぞ。法律の側が\n引き下がっているという話になる"}, {"t": 251.01666666666668, "x": "割引はこちらの財布の話だが、\nこちらは相手の権限の話になってくる"}, {"t": 256.23333333333335, "x": "しかも九十パーセントと七十五パーセントと\nいう、広い範囲で通ってしまう"}, {"t": 261.1166666666667, "x": "一つの国が例外を認めるだけなら、\n条約のようなものだと説明が付く"}, {"t": 266.1666666666667, "x": "まだ分かる"}, {"t": 266.95, "x": "だが大半の国が同じ扱いをしているとなると、\n話の規模が変わってくるぞ"}, {"t": 272.06666666666666, "x": "世界のほとんどが同じ判断をしている、\nということになってしまうからな"}, {"t": 276.23333333333335, "x": "ハンター協会は国ではないし、\nどこの政府にも属していない組織だ"}, {"t": 280.78333333333336, "x": "完全な民間だ"}, {"t": 282.15, "x": "その民間組織が出した身分証が、\n国境の判断を上書きしていることになる"}, {"t": 287.4166666666667, "x": "順番が逆だろ"}, {"t": 288.6666666666667, "x": "普通に考えれば、国が発行したものが\n一番強いはずの場面だからな"}, {"t": 293.6666666666667, "x": "旅券より上か"}, {"t": 294.78333333333336, "x": "ここだけ力関係が\nひっくり返っているから、\n他と釣り合わなくなる"}, {"t": 299.3666666666667, "x": "施設が無料になるのと、入国禁止の\n国に入れるのは同じ並びに置けないぞ"}, {"t": 304.46666666666664, "x": "値引きと通行許可を同じ表に\n並べているのが、そもそも大雑把なんだ"}, {"t": 308.78333333333336, "x": "一枚のカードの説明の中に、\n性質の違うものが混ざっているわけだ"}, {"t": 313.6166666666667, "x": "気づきにくい仕掛けだ"}, {"t": 315.06666666666666, "x": "数字が並んでいると、全部が\n同じ種類の特典に見えてしまうからな"}, {"t": 319.68333333333334, "x": "無料の施設が九十五パーセント、\n入れる国が九十パーセント。同じ顔で並ぶ"}, {"t": 325.51666666666665, "x": "そこが罠だ"}, {"t": 326.51666666666665, "x": "数字が大きい方が偉く見えるので、\n性質の違いが見えにくくなっている"}, {"t": 331.1333333333333, "x": "片方は財布の話で、もう片方は主権の\n話になっているのが実際のところだ"}, {"t": 336.75, "x": "これが一つだけ釣り合っていない、\nという言い方の中身になる"}, {"t": 340.25, "x": "納得した"}, {"t": 341.0833333333333, "x": "そう考えると、あの試験の\n殺伐とした空気にも説明が付いてくるぞ"}, {"t": 345.9166666666667, "x": "価値に見合っている"}, {"t": 347.1333333333333, "x": "年に一度しか実施されないし、\n通る人数もかなり絞られているだろ"}, {"t": 351.6166666666667, "x": "世界の大半に入れる権利を配る試験なら、\nあの厳しさでも足りないぐらいだ"}, {"t": 356.6166666666667, "x": "むしろ甘いのか"}, {"t": 357.75, "x": const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
